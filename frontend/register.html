<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — NexLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <span class="logo-icon">N</span> NexLearn
      </a>
      <h2>Create your account</h2>
      <p class="subtitle">Join thousands of Bangladeshi students learning with AI</p>

      <div id="form-error"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" class="form-control" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 10 chars, upper, lower, number" required>
          <p class="form-hint">At least 10 characters with uppercase, lowercase, and a number</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('form-error');
      const btn = document.getElementById('submit-btn');
      App.clearError(errorEl);
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await api.post('/auth/register', {
          fullName: document.getElementById('fullName').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });

        const loginRes = await api.post('/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });

        Auth.setTokens(loginRes.data.accessToken, loginRes.data.refreshToken);
        Auth.setUser(loginRes.data.user);
        window.location.href = 'profile.html';
      } catch (err) {
        const msg = Array.isArray(err.data?.message)
          ? err.data.message.join(', ')
          : err.message || 'Registration failed.';
        App.showError(errorEl, msg);
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
