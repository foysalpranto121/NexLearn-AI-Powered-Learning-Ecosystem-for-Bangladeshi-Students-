<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — NexLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <span class="logo-icon">N</span> NexLearn
      </a>
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue your learning journey</p>

      <div id="form-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('form-error');
      const btn = document.getElementById('submit-btn');
      App.clearError(errorEl);
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await api.post('/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });

        Auth.setTokens(res.data.accessToken, res.data.refreshToken);
        Auth.setUser(res.data.user);

        const complete = await Auth.isProfileComplete();
        window.location.href = complete ? 'dashboard.html' : 'profile.html';
      } catch (err) {
        const msg = err.message?.includes('fetch')
          ? 'Cannot reach server. Make sure the backend is running on port 3000.'
          : (err.message || 'Login failed. Check your credentials.');
        App.showError(errorEl, msg);
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
